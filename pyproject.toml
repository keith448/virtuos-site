[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtuos-eval"
version = "0.1.0"
description = "A draft corpus of cross-lineage wisdom, with a forced-choice benchmark runner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "VirtuOS" }]
keywords = ["evaluation", "ethics", "dataset", "cross-cultural"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
virtuos = "virtuos_eval.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtuos_eval = ["data/*.jsonl", "data/LICENSE-DATA.md"]
